[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dynasty-football-backend"
version = "0.1.0"
description = "Dynasty Football: Next Gen — game API and simulation services"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143",
    "sqlalchemy>=2.1",
    "psycopg[binary]>=3.3",
    "alembic>=1.20",
    "pydantic>=2.14",
    "pydantic-settings>=2.15",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx>=0.28", "ruff>=0.17"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

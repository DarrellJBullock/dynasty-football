name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dynasty
          POSTGRES_PASSWORD: dynasty
          POSTGRES_DB: dynasty_football
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dynasty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://dynasty:dynasty@localhost:5432/dynasty_football
      TEST_DATABASE_URL: postgresql+psycopg://dynasty:dynasty@localhost:5432/dynasty_football_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Apply migrations to an empty database
        run: alembic upgrade head

      - name: Check models match migrations
        run: alembic check

      - name: Seed the sample league
        run: python -m app.seed

      - name: Create test database
        run: PGPASSWORD=dynasty psql -h localhost -U dynasty -d dynasty_football -c "CREATE DATABASE dynasty_football_test"

      - name: Tests (PostgreSQL)
        run: pytest

      - name: Tests (SQLite)
        run: env -u TEST_DATABASE_URL pytest

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # run by hand (Actions → CI → Run workflow)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrations, tests on PostgreSQL)
    runs-on: ubuntu-latest
    # The tests take 18-27 minutes on a hosted runner, and the read budgets a few more.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dynasty
          POSTGRES_PASSWORD: dynasty
          POSTGRES_DB: dynasty_football
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dynasty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://dynasty:dynasty@localhost:5432/dynasty_football
      TEST_DATABASE_URL: postgresql+psycopg://dynasty:dynasty@localhost:5432/dynasty_football_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Apply migrations to an empty database
        run: alembic upgrade head

      - name: Check models match migrations
        run: alembic check

      - name: Seed the sample league
        run: python -m app.seed

      - name: Create test database
        run: PGPASSWORD=dynasty psql -h localhost -U dynasty -d dynasty_football -c "CREATE DATABASE dynasty_football_test"

      - name: Tests (PostgreSQL)
        run: pytest

      # Every API read on a league with two seasons played: within 600 ms at the 95th
      # percentile (the 300 ms budget with room for a slow runner) and 80 queries.
      - name: Read budgets
        run: |
          python -m app.perf build --seasons 2
          python -m app.perf measure --runs 5 --budget-ms 600 --max-queries 80

  # The same tests on in-memory SQLite (the local default), in parallel with PostgreSQL.
  backend-sqlite:
    name: Backend (tests on SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Tests (SQLite)
        run: pytest

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dynasty
          POSTGRES_PASSWORD: dynasty
          POSTGRES_DB: dynasty_football_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dynasty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+psycopg://dynasty:dynasty@localhost:5432/dynasty_football_e2e
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: pip install -e "backend[dev]"

      - name: Migrate e2e database
        working-directory: backend
        run: alembic upgrade head
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium


      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run e2e

      # Also when a test only passed on its retry, so a flaky failure's trace is kept.
      - name: Upload report and traces
        if: ${{ !cancelled() && hashFiles('frontend/test-results/**/trace.zip') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14

  images:
    name: Container images (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dynasty
          POSTGRES_PASSWORD: dynasty
          POSTGRES_DB: dynasty_football
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dynasty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7


      - name: Build the API image
        run: docker build -t dynasty-api --build-arg RELEASE=${{ github.sha }} backend

      - name: Build the web image
        run: docker build -t dynasty-web --build-arg RELEASE=${{ github.sha }} frontend

      - name: Smoke test (migrate, then the API, worker and web app as deployed)
        run: scripts/smoke-test-images.sh dynasty-api dynasty-web
        env:
          DATABASE_URL: postgresql://dynasty:dynasty@localhost:5432/dynasty_football

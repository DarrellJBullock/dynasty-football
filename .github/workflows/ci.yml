name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrations, tests on PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dynasty
          POSTGRES_PASSWORD: dynasty
          POSTGRES_DB: dynasty_football
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dynasty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://dynasty:dynasty@localhost:5432/dynasty_football
      TEST_DATABASE_URL: postgresql+psycopg://dynasty:dynasty@localhost:5432/dynasty_football_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Apply migrations to an empty database
        run: alembic upgrade head

      - name: Check models match migrations
        run: alembic check

      - name: Seed the sample league
        run: python -m app.seed

      - name: Create test database
        run: PGPASSWORD=dynasty psql -h localhost -U dynasty -d dynasty_football -c "CREATE DATABASE dynasty_football_test"

      - name: Tests (PostgreSQL)
        run: pytest

      # Every API read on a league with two seasons played: within 600 ms at the 95th
      # percentile (the 300 ms budget with room for a slow runner) and 80 queries.
      - name: Read budgets
        run: |
          python -m app.perf build --seasons 2
          python -m app.perf measure --runs 5 --budget-ms 600 --max-queries 80

  # The same tests on in-memory SQLite (the local default), in parallel with PostgreSQL.
  backend-sqlite:
    name: Backend (tests on SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Tests (SQLite)
        run: pytest

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # The Unity viewer (docs/design/depth-and-unity.md §4): its edit-mode tests and the WebGL
  # build the web image serves from /unity/. GameCI runs Unity in a container and needs the
  # repository's Unity license secrets (docs/unity.md); without them this job says so and
  # skips, and the site runs without the Unity renderer.
  unity:
    name: Unity (tests and WebGL build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      built: ${{ steps.build.outcome == 'success' }}
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check for a Unity license
        id: license
        run: |
          if [ -n "$UNITY_LICENSE" ] || { [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; }; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Unity license in this repository's secrets (docs/unity.md): skipping Unity's tests and build."
          fi

      - uses: actions/checkout@v7
        if: steps.license.outputs.present == 'true'

      - uses: actions/cache@v4
        if: steps.license.outputs.present == 'true'
        with:
          path: unity/Library
          key: unity-library-${{ hashFiles('unity/Packages/**', 'unity/ProjectSettings/**', 'unity/Assets/**') }}
          restore-keys: unity-library-

      - name: Tests (edit mode)
        if: steps.license.outputs.present == 'true'
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: unity
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: WebGL build
        id: build
        if: steps.license.outputs.present == 'true'
        uses: game-ci/unity-builder@v4
        with:
          projectPath: unity
          targetPlatform: WebGL
          buildMethod: Dynasty.BuildScript.BuildWebGL
          customParameters: -buildOutput /github/workspace/frontend/public/unity

      - uses: actions/upload-artifact@v7
        if: steps.build.outcome == 'success'
        with:
          name: unity-webgl
          path: frontend/public/unity
          retention-days: 30

  e2e:
    name: End-to-end (Playwright)
    needs: unity # (its build, when there is one, so the Unity viewer's spec runs too)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dynasty
          POSTGRES_PASSWORD: dynasty
          POSTGRES_DB: dynasty_football_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dynasty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+psycopg://dynasty:dynasty@localhost:5432/dynasty_football_e2e
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: pip install -e "backend[dev]"

      - name: Migrate e2e database
        working-directory: backend
        run: alembic upgrade head
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Unity viewer build
        if: needs.unity.outputs.built == 'true'
        uses: actions/download-artifact@v7
        with:
          name: unity-webgl
          path: frontend/public/unity

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run e2e

      # Also when a test only passed on its retry, so a flaky failure's trace is kept.
      - name: Upload report and traces
        if: ${{ !cancelled() && hashFiles('frontend/test-results/**/trace.zip') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14

  images:
    name: Container images (build and smoke test)
    needs: unity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dynasty
          POSTGRES_PASSWORD: dynasty
          POSTGRES_DB: dynasty_football
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dynasty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Unity viewer build (served by the web image)
        if: needs.unity.outputs.built == 'true'
        uses: actions/download-artifact@v7
        with:
          name: unity-webgl
          path: frontend/public/unity

      - name: Build the API image
        run: docker build -t dynasty-api --build-arg RELEASE=${{ github.sha }} backend

      - name: Build the web image
        run: docker build -t dynasty-web --build-arg RELEASE=${{ github.sha }} frontend

      - name: Smoke test (migrate, then the API, worker and web app as deployed)
        run: scripts/smoke-test-images.sh dynasty-api dynasty-web
        env:
          DATABASE_URL: postgresql://dynasty:dynasty@localhost:5432/dynasty_football
